<!doctype html>
<html lang="en" translate="no" class="notranslate skiptranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<title>AI Home — Sunlit Tree</title>
<style>
body font,
body [class*="immersive-translate"],
body [class*="cye-"] {
  display: contents !important;
  font: inherit !important;
  line-height: inherit !important;
}
[data-at-text]::after { content: attr(data-at-text); }
:root{
--green:#0b8457;--red:#c71a1a;--muted:#4b5563;
--hdr:6.25rem;--pad:6.25%;
--gap:.65rem;--gap-sm:.35rem;
--img-h:110px;--img-h-sm:75px;
--fs-label:14px;--fs-label-sm:11px;
--row-min:120px;
--card-bg:#fff;--card-radius:12px;
--card-shadow:0 6px 18px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
font-family:'Segoe UI',Arial,sans-serif;
background:linear-gradient(180deg,#e8fbeb,#daf6e0);
color:#0b2b22;
-webkit-font-smoothing:antialiased;
overflow:hidden;
}
header.site-header{
position:relative;margin-inline:var(--pad);
height:var(--hdr);display:flex;flex-direction:column;z-index:50;
}
.top-row{display:flex;align-items:center;justify-content:space-between;height:1.2rem;padding-top:.8rem;transform:translateY(2em)}
.logo{display:flex;align-items:center;gap:.5rem}
.logo img{height:88px;width:auto;border-radius:6px}
nav.top-nav{position:absolute;left:calc(22.857% - 1ch);display:flex;gap:calc(1.25rem + 3ch);align-items:center;transform:none}
nav.top-nav a{text-decoration:none}
.nav-item{font-size:18px;color:var(--muted);font-weight:600;text-decoration:none}
.banner{display:flex;align-items:center;justify-content:center;height:3rem;transform:translateY(4em)}
.slogan{font-size:28px;color:var(--red);font-weight:800}
.main{display:flex;margin-top:var(--hdr)}
.sidebar{
width:20%;min-width:180px;padding-top:calc(11rem - var(--hdr));
position:fixed;top:var(--hdr);left:var(--pad);bottom:0;
}
.sidebar-item{
display:block;width:100%;padding:.6rem .75rem;color:var(--muted);
font-size:16px;border-radius:8px;cursor:pointer;
background:0 0;border:0;text-align:left;
}
.sidebar-item.active{color:var(--green);background:rgba(11,132,87,.06)}
.categories-row{
position:fixed;top:11rem;left:26.25%;right:6.25%;height:2.4rem;
display:flex;align-items:center;justify-content:center;
color:var(--red);font-weight:700;z-index:46;
background:rgba(255,255,255,.85);
backdrop-filter:blur(6px);
border-bottom:1px solid rgba(0,0,0,.05);
}
.categories-center{font-size:18px}
.scroll-container{
position:absolute;top:13.4rem;
left:calc(var(--pad) + 20%);right:var(--pad);bottom:0;
overflow-y:auto;padding:1rem 2ch 1rem 0;
}
.scroll-container img{max-width:100%;height:auto}
.section-title{
margin:1.5rem 0 1rem;text-align:left;
font:700 18px/1.5 'Segoe UI',Arial,sans-serif;
color:var(--red);
}
.card-grid{
display:grid;
grid-template-columns:repeat(5,minmax(0,1fr));
grid-auto-rows:minmax(var(--row-min),auto);
gap:var(--gap);
}
#content-grid{margin-bottom:1rem}
.card{
display:flex;min-width:0;flex-direction:column;
align-items:center;justify-content:center;padding:.5rem;
background:var(--card-bg);border-radius:var(--card-radius);
box-shadow:var(--card-shadow);
text-decoration:none;color:inherit;
transition:transform .2s,box-shadow .2s;
}
.card:hover{transform:translateY(-4px)}
.card img{display:block;width:100%;height:var(--img-h);object-fit:contain}
.card span{
max-width:100%;padding-top:.35rem;font-size:var(--fs-label);
overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.after-image-toggle{
display:block;margin:1.25rem auto;padding:.5rem 1rem;
border:0;border-radius:8px;background:var(--red);color:#fff;
font:inherit;cursor:pointer;transition:filter .2s;
}
.after-image-toggle:hover{filter:brightness(.92)}
.logo-footer{text-align:center;margin-top:2rem}
.logo-img{display:block;max-width:100%;height:auto;border-radius:6px;margin:0 auto .5rem}
.logo-slogan{margin-top:.5rem;color:var(--muted)}
.footer-spacer{height:2rem}
.footer-nav{display:flex;justify-content:center;gap:2rem;margin-top:1.5rem}
.footer-nav a{color:inherit}
.site-footer{text-align:center;padding:2.5rem 0;margin-top:2rem;color:var(--muted)}
@media(max-width:1024px){
body{display:flex;height:100vh;height:100dvh;flex-direction:column;overflow:hidden;padding-inline:2ch;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header.site-header{flex:none;height:auto;margin-inline:0;padding:0 1rem}
.top-row{height:auto;min-height:1.2rem;gap:.75rem;flex-wrap:wrap}
.logo img{height:clamp(48px,8vw,72px)}
nav.top-nav{
position:static;
flex:1 1 auto;min-width:0;flex-wrap:wrap;
justify-content:flex-start;gap:.5rem 3ch;transform:translateX(5ch);
}
.nav-item{font-size:clamp(.8rem,1.7vw,1rem);white-space:nowrap}
.nav-item,.sidebar-item{font:400 16px 'Segoe UI',Arial,sans-serif}
.banner{height:auto;min-height:3rem;padding:.5rem 0}
.slogan{max-width:100%;font-size:clamp(1rem,3vw,1.75rem);text-align:center;transform:translateY(-2em)}
.main{display:flex;flex:1;flex-direction:column;min-height:0;margin-top:1rem}
.sidebar{position:relative;top:auto;left:auto;bottom:auto;display:flex;flex-wrap:wrap;gap:.35rem .5rem;width:100%;min-width:0;padding:0 0 0 calc(1rem + 3ch)}
.sidebar-item{width:auto;flex:0 0 auto}
.content-wrap{display:flex;flex:1;flex-direction:column;min-height:0;margin-left:0;width:100%}
.scroll-container{position:relative;top:auto;left:auto;right:auto;bottom:auto;flex:1;min-height:0;overflow-y:auto;padding:1rem 2ch 1rem 0}
.categories-row{position:static;flex:none;height:auto;padding:.5rem 0}
.card img{width:calc(100% - 1ch);height:calc(var(--img-h) - 1ch)}
}
@media(max-width:700px){
header.site-header{height:auto}
.top-row{transform:translateY(1em)}
.logo img{height:48px}
nav.top-nav{width:100%;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:4px 3ch;transform:translate(3ch,-2em)}
.nav-item,.sidebar-item{font:400 16px 'Segoe UI',Arial,sans-serif}
.nav-item{text-align:center}
.card-grid{gap:var(--gap-sm);grid-auto-rows:minmax(100px,auto)}
.card{padding:.25rem}
.card img{height:calc(var(--img-h-sm) - 1ch)}
.card span{font-size:var(--fs-label-sm)}
}
@media(max-width:768px) and (orientation:portrait){
  .main{margin-top:-3em}
  .top-row{height:auto;min-height:42px;padding:12px 0 8px;flex-wrap:wrap;gap:8px 12px;transform:translateY(2em)}
  .top-row .logo{order:2;flex:0 0 100%;justify-content:flex-start;margin-left:1ch;position:relative;left:-2ch}
  .logo img{height:auto;width:clamp(52px,12vw,76px);aspect-ratio:1}
  nav.top-nav{display:flex;position:static;order:1;flex:0 0 100%;width:100%;min-width:0;justify-content:space-between;flex-flow:row nowrap;gap:3ch;transform:translateY(-1em)}
  nav.top-nav .nav-item{
    flex:1 1 20%;min-width:0;text-align:center;font-size:16px;
    transform:translateX(var(--menu-shift,0ch));
  }
  .nav-item[href="blog.html"]{position:fixed}
  .nav-item[href="pages/Join-Login.html"]{--menu-shift:1ch}
  .nav-item[href="prompt.html"]{--menu-shift:6ch}
  .nav-item[href="gv1.html"]{--menu-shift:-1ch}
  .nav-item[href="life.html"]{--menu-shift:2ch}
  .sidebar{left:4ch}
  .banner{transform:translateY(0)}
  .slogan{transform:none;position:relative;top:-3.2em;left:2ch}
}
</style>
</head>
<body>
<header class="site-header" data-at-lock data-at-skip>
  <div class="top-row">
    <a class="logo" href="./index.html" aria-label="Back to home">
      <img src="./ok012_a.png" alt="Logo" onerror="this.src='https://picsum.photos/seed/logo/120/40'">
    </a>
    <nav class="top-nav" aria-label="Primary navigation">
      <a href="blog.html" class="nav-item">Blog</a>
      <a href="prompt.html" class="nav-item">Prompt</a>
      <a href="life.html" class="nav-item">Life</a>
      <a href="gv1.html" class="nav-item">Community</a>
      <a href="pages/Join-Login.html" class="nav-item" data-at-text="Join&amp;Login" aria-label="Join &amp; Login"></a>
    </nav>
  </div>
  <div class="banner">
    <div class="slogan">Learn and Practice AI Skills!</div>
  </div>
</header>
<main class="main" role="main">
  <aside id="sidebar" class="sidebar" aria-label="Sidebar"></aside>
  <section class="content-wrap">
    <div class="categories-row" role="region" aria-label="Category headings">
      <div class="categories-center">AI-Category Links</div>
    </div>

    <div class="scroll-container">
      <div id="content-grid" class="card-grid" aria-label="AI-Category Links"></div>
      <div id="main-sections"></div>
      <button id="more-toggle" class="after-image-toggle" type="button" aria-expanded="false"
        aria-controls="after-image-sections">
        Expand More Categories
      </button>
      <div id="after-image-sections" hidden></div>
      <div class="logo-footer">
        <a href="./index.html" aria-label="Back to home">
          <img src="./ok012_a.png" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </a>
        <div class="logo-slogan">Follow me, save me, and easily step into the AI era!</div>
      </div>
      <div class="footer-spacer"></div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="pages/Website-collaboration.html">Website collaboration</a>
        <a href="pages/About-Us.html">About Us</a>
        <a href="pages/Partners-Collaborators.html">Partners and Collaborators</a>
      </nav>
      <footer class="site-footer">
        Copyright © 2025 AI &nbsp;&nbsp; Contact Us Email: udedv12@outlook.com
      </footer>
    </div>
  </section>
</main>
<script>
(() => {
'use strict';
const protectedHeader = document.querySelector('header[data-at-lock]');
if (protectedHeader && 'MutationObserver' in window) {
  const lockedMarkup = protectedHeader.innerHTML;
  const observer = new MutationObserver(() => {
    if (protectedHeader.innerHTML !== lockedMarkup) protectedHeader.innerHTML = lockedMarkup;
  });
  observer.observe(protectedHeader, {
    attributes: true,
    childList: true,
    characterData: true,
    subtree: true
  });
}
const CATEGORIES = [
{ id:'life', label:'Life', title:'Life is sorted by AI', nav:true, main:true },
{ id:'health', label:'Health', title:'Health is sorted by AI', nav:true, main:true },
{ id:'campus', label:'Campus', title:'Campus is sorted by AI', nav:false, main:true },
{ id:'work', label:'Work', title:'Work is sorted by AI', nav:true, main:true },
{ id:'pro', label:'Pro', title:'Pro-applications is sorted by AI', nav:false, main:true },
{ id:'design', label:'Design', title:'Design is sorted by AI', nav:false, main:true },
{ id:'image', label:'Image', title:'Images are sorted by AI', nav:true, main:true },
{ id:'video', label:'Video', title:'Video is sorted by AI', nav:true, main:true },
{ id:'audio', label:'Audio', title:'Audio is sorted by AI', nav:true, main:true },
{ id:'programming', label:'Programming', title:'Programming is sorted by AI', nav:false, main:false },
{ id:'agent', label:'Agent', title:'Agent is sorted by AI', nav:false, main:false }
];
const SITE_DATA = {
  life: ['app.karpo.ai','elsaspeak.com','flash.co','kindroid.ai','pi.ai','replika.com','sleepcycle.com','thefabulous.co','wanderboat.ai','youper.ai'],
  health: ['ada.com','doctronic.com','docus.ai','exscientia.ai','healthtap.com','healz.ai','khealth.com','lunit.io','mediktor.com','suki.ai'],
  campus: ['century.tech','coursera.org','duolingo.com','edu.google.com','iflytek.com','khanacademy.org','magicschool.ai','quizlet.com','schoolai.com','squirrelai.com'],
  work: ['chatgpt.com','claude.ai','clickup.com','deepl.com','gemini.google.com','github.com','notion.so','otter.ai','slack.com','zapier.com'],
  pro: ['abridge.com','eliseai.com','harvey.ai','ironclad.com','luminance.com','numeric.io','procore.com','suki.ai','veeva.com','viz.ai'],
  design: ['canva.com','capcut.com','figma.com','framer.com','kittl.com','looka.com','pixso.cn','remove.bg','tripo3d.ai','uizard.io'],
  image: ['adobe.com','bfl.ai','bing.com','ideogram.ai','leonardo.ai','midjourney.com','openart.ai','recraft.ai','seaart.ai','stability.ai'],
  video: ['genmo.ai','hailuoai.video','heygen.com','invideo.io','klingai.com','lumalabs.ai','pika.art','pixverse.ai','runwayml.com','synthesia.io'],
  audio: ['aiva.ai','descript.com','elevenlabs.io','lalal.ai','murf.ai','podcastle.ai','riverside.fm','speechify.com','suno.com','udio.com'],
  programming: ['bolt.new','claude.ai','cursor.com','github.com','lovable.dev','openai.com','qodo.ai','replit.com','tabnine.com','v0.dev'],
  agent: ['character.ai','chatgpt.com','claude.ai','coze.com','cursor.com','dify.ai','gamma.app','genspark.ai','glean.com','grok.com','kimi.com','lovable.dev','manus.im','openclaw.ai','replit.com']
};
const CATEGORY_DIRS = { health: 'Health', audio: 'aodio', programming: 'Programming' };
const CATEGORY_IMAGES = { 'pro:veeva.com': 'vee%20va.com.jpeg' };
const TOP_SITES = [
  ['bing.com','bing.com.jpg'],['canva.com','canva.com.jpg'],['character.ai','character.ai.jpg'],
  ['chatgpt.com','chatgpt.com.jpg'],['claude.ai','claude.ai.jpg'],['cursor.com','cursor.com.jpg'],
  ['gamma.app','gamma.app.jpg'],['grok.com','grok.com.png'],['kimi.com','kimi.com.png'],
  ['lmarena.ai','lmarena.ai.jpg'],['lovable.dev','lovable.dev.jpeg'],['manus.im','manus.im.png'],
  ['notion.so','notion.so.png'],['openai.com','openai.com.jpeg'],['perplexity.ai','perplexity.ai.jpg']
];
const $ = id => document.getElementById(id);
const card = (href, img) =>
`<a class="card" href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${href}">
  <img src="${img}" alt="" loading="lazy" onerror="this.hidden=true"><span>${href.replace(/^https:\/\/(www\.)?/, '')}</span>
</a>`;
const renderSections = () => {
const mainSections = $('main-sections');
const collapsedSections = $('after-image-sections');
$('sidebar').innerHTML = CATEGORIES.filter(c => c.nav)
.map(c => `<button class="sidebar-item" data-target="${c.id}-title">${c.label} AI</button>`)
.join('');
CATEGORIES.forEach(({ id, title }, index) => {
const sectionContainer = index <= CATEGORIES.findIndex(category => category.id === 'image')
? mainSections
: collapsedSections;
sectionContainer.insertAdjacentHTML('beforeend',
`<h2 id="${id}-title" class="section-title">${title}</h2>
<div id="${id}-grid" class="card-grid" aria-label="${title}"></div>`);
const sites = SITE_DATA[id];
if (sites) {
const dir = CATEGORY_DIRS[id] || id;
$(`${id}-grid`).innerHTML = sites.map(domain =>
card(`https://${domain}`, `aituji/${dir}/${CATEGORY_IMAGES[`${id}:${domain}`] || `${domain}.jpeg`}`)
).join('');
}
});
};
const renderTopSites = () => {
$('content-grid').innerHTML = TOP_SITES
.map(([domain, image]) => card(`https://${domain}`, `aituji/Category/${image}`))
.join('');
};
const initSidebar = () => {
const scroll = document.querySelector('.scroll-container');
const isNarrow = matchMedia('(max-width:1024px)');

$('sidebar').addEventListener('click', e => {
const btn = e.target.closest('.sidebar-item');
if (!btn) return;
const target = $(btn.dataset.target);
if (!target) return;
$('sidebar').querySelectorAll('.sidebar-item')
.forEach(b => b.classList.toggle('active', b === btn));
if (isNarrow.matches) {
target.scrollIntoView({ behavior:'smooth', block:'start' });
} else if (scroll) {
const pad = parseFloat(getComputedStyle(scroll).paddingTop) || 0;
scroll.scrollTo({ top: target.offsetTop - pad, behavior:'smooth' });
}
});
};
const initToggle = () => {
const tg = $('more-toggle'), sec = $('after-image-sections');
tg.addEventListener('click', () => {
const open = tg.getAttribute('aria-expanded') !== 'true';
tg.setAttribute('aria-expanded', String(open));
sec.hidden = !open;
tg.textContent = open ? 'Collapse More Categories' : 'Expand More Categories';
});
};
const init = () => {
renderSections();
renderTopSites();
initSidebar();
initToggle();
$('sidebar').querySelector('.sidebar-item')?.classList.add('active');
};
document.readyState === 'loading'
? document.addEventListener('DOMContentLoaded', init)
: init();
})();
</script>
</body>

</html>
