  <script>
    (() => {
      const header = document.querySelector('header[data-at-lock]');
      if (!header || !('MutationObserver' in window)) return;

      const lockedMarkup = header.innerHTML;
      const observer = new MutationObserver(() => {
        if (header.innerHTML !== lockedMarkup) header.innerHTML = lockedMarkup;
      });

      observer.observe(header, {
        attributes: true,
        childList: true,
        characterData: true,
        subtree: true
      });
    })();
